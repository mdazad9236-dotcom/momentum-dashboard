name: One-time chart workspace patch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          marker = '    html = html.replace("</body>", guard_js + step3_js + broker_ui_js + step2_js + "</body>")'
          if 'AZ_CHART_WORKSPACE_V1' in s:
              raise SystemExit(0)
          chart = r'''    chart_workspace_js = r'''<style id="AZ_CHART_WORKSPACE_V1">
.az-chart-tools{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:8px}.az-chart-tools button{border:1px solid #29445d;background:#091827;color:#9db0c3;border-radius:7px;padding:6px 8px;font-size:8px;font-weight:900;cursor:pointer}.az-chart-tools button.active,.az-chart-tools button:hover{border-color:#ff7a18;color:#fff;background:rgba(255,122,24,.12)}.az-chart-tools .sep{width:1px;height:20px;background:#29445d}.az-chart-wrap{min-height:390px!important;position:relative}.az-chart-help{font-size:8px;color:#71879b;margin-left:4px}
</style><script>(function(){
let azTool='cursor',azDrawStart=null,azDrawings=[];
function toolBar(){const host=document.getElementById('azPanelChart')||document.getElementById('azChartWrap')?.parentElement;if(!host||document.getElementById('azChartTools'))return;const box=document.createElement('div');box.id='azChartTools';box.className='az-chart-tools';box.innerHTML='<button class="active" data-t="cursor">↖ Cursor</button><button data-t="hline">H-Line</button><button data-t="trend">Trend</button><button data-t="ray">Ray</button><button data-t="rect">Rect</button><button data-t="fib">Fib</button><button data-t="measure">Measure</button><button data-t="text">Text</button><span class="sep"></span><button data-act="reset">Reset</button><button data-act="clear">Clear</button><span class="az-chart-help">Click a tool, then draw on the chart</span>';host.appendChild(box);box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{azTool=b.dataset.t;box.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('active',x===b));azDrawStart=null});box.querySelector('[data-act="reset"]').onclick=()=>{if(typeof resetChart==='function')resetChart()};box.querySelector('[data-act="clear"]').onclick=()=>{azDrawings=[];azDrawStart=null;safeDraw()}}
function point(e){const c=document.getElementById('azCanvas');if(!c||!window.currentCandles)return null;const r=c.getBoundingClientRect(),data=currentCandles.slice(chartState.start,chartState.end);if(!data.length)return null;const l=58,rr=18,t=38,b=70,w=r.width,h=r.height;const step=(w-l-rr)/data.length;const i=Math.max(0,Math.min(data.length-1,Math.floor((e.clientX-r.left-l)/Math.max(1,step))));const hi=Math.max(...data.map(x=>x.h)),lo=Math.min(...data.map(x=>x.l)),span=hi-lo||1,ph=Math.max(100,h-t-b-65);return{idx:chartState.start+i,price:hi-((e.clientY-r.top-t)/ph)*span}}
function safeDraw(){try{if(typeof drawAdvancedChart==='function')drawAdvancedChart()}catch(e){console.warn('chart draw',e)};renderDrawings()}
function renderDrawings(){const c=document.getElementById('azCanvas');if(!c||!azDrawings.length)return;const ctx=c.getContext('2d'),r=c.getBoundingClientRect(),data=currentCandles.slice(chartState.start,chartState.end);if(!data.length)return;const l=58,rr=18,t=38,b=70,w=r.width,h=r.height,hi=Math.max(...data.map(x=>x.h)),lo=Math.min(...data.map(x=>x.l)),span=hi-lo||1,ph=Math.max(100,h-t-b-65),xf=i=>l+((i-chartState.start)+.5)*((w-l-rr)/data.length),yf=p=>t+(hi-p)/span*ph;ctx.save();ctx.lineWidth=1.5;ctx.strokeStyle='#ffb06f';ctx.fillStyle='rgba(255,176,111,.10)';ctx.font='9px Arial';azDrawings.forEach(d=>{if(d.type==='hline'){const y=yf(d.p1);ctx.beginPath();ctx.moveTo(l,y);ctx.lineTo(w-rr,y);ctx.stroke();ctx.fillText('H '+Number(d.p1).toFixed(2),w-85,y-4)}else{const x1=xf(d.i1),y1=yf(d.p1),x2=xf(d.i2),y2=yf(d.p2);if(d.type==='trend'||d.type==='ray'){let ex=x2,ey=y2;if(d.type==='ray'){ex=w-rr;ey=y1+(ex-x1)*(y2-y1)/(x2-x1||1)}ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(ex,ey);ctx.stroke()}else if(d.type==='rect'){ctx.fillRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));ctx.strokeRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1))}else if(d.type==='fib'){[0,.236,.382,.5,.618,.786,1].forEach(f=>{const p=Math.min(d.p1,d.p2)+Math.abs(d.p2-d.p1)*f,y=yf(p);ctx.beginPath();ctx.moveTo(Math.min(x1,x2),y);ctx.lineTo(Math.max(x1,x2),y);ctx.stroke();ctx.fillText((f*100).toFixed(1)+'% '+p.toFixed(2),Math.min(x1,x2)+4,y-3)})}else if(d.type==='measure'){ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);ctx.fillText((d.p2-d.p1>=0?'+':'')+(d.p2-d.p1).toFixed(2),Math.min(x1,x2)+4,Math.min(y1,y2)-5)}else if(d.type==='text'){ctx.fillText(d.text||'Note',x1,y1)}}});ctx.restore()}
function bind(){toolBar();const c=document.getElementById('azCanvas');if(!c||c.dataset.azTools)return;c.dataset.azTools='1';c.addEventListener('mousedown',e=>{if(azTool==='cursor')return;const p=point(e);if(!p)return;if(azTool==='hline'){azDrawings.push({type:'hline',i1:p.idx,p1:p.price,i2:p.idx,p2:p.price});safeDraw();return}if(azTool==='text'){const text=window.prompt('Chart note:','');if(text){azDrawings.push({type:'text',i1:p.idx,p1:p.price,text});safeDraw()}return}azDrawStart=p});c.addEventListener('mouseup',e=>{if(!azDrawStart||azTool==='cursor'||azTool==='hline'||azTool==='text')return;const p=point(e);if(!p)return;azDrawings.push({type:azTool,i1:azDrawStart.idx,p1:azDrawStart.price,i2:p.idx,p2:p.price});azDrawStart=null;safeDraw()})}
const od=window.drawAdvancedChart;window.drawAdvancedChart=function(){if(typeof od==='function')od.apply(this,arguments);toolBar();renderDrawings()};setInterval(bind,700);})();</script>'''
          s = s.replace(marker, marker.replace(' + "</body>")', ' + chart_workspace_js + "</body>")') )
          # Reduce chart historical load from 400 to 120 days in the dedicated index endpoint only.
          old = 'definition["token"],\n            days=400,\n            interval="ONE_DAY",\n            exchange=definition.get("exchange", "NSE"),'
          new = 'definition["token"],\n            days=120,\n            interval="ONE_DAY",\n            exchange=definition.get("exchange", "NSE"),'
          s = s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "ui: add index chart workspace" || exit 0
          git push
