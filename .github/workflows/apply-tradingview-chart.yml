name: apply-tradingview-chart
on:
  push:
    paths:
      - .github/workflows/apply-tradingview-chart.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply chart-only patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          repo=Path('.')
          subprocess.run(['git','checkout','2656b1c0922298ddbd4843ec1ae05a7379f6b467','--','app.py'],check=True)
          p=repo/'templates'/'index.html'
          html=p.read_text(encoding='utf-8')
          marker='/* AZAD_TRADINGVIEW_CHART_V1 */'
          if marker not in html:
            script=r'''<script>
/* AZAD_TRADINGVIEW_CHART_V1 */
(function(){
function tvSymbol(s){const raw=String((s&&s.symbol)||'').trim().toUpperCase(),name=String((s&&s.name)||raw).trim().toUpperCase();if(s&&s.isIndex){const m={'NIFTY 50':'NSE:NIFTY','NIFTY':'NSE:NIFTY','BANK NIFTY':'NSE:BANKNIFTY','BANKNIFTY':'NSE:BANKNIFTY','SENSEX':'BSE:SENSEX','INDIA VIX':'NSE:INDIAVIX'};if(m[name])return m[name];return raw.includes(':')?raw:'NSE:'+raw.replace(/[^A-Z0-9]/g,'')}const sym=raw.replace(/^NSE:/,'').replace(/[^A-Z0-9_]/g,'');return sym?'NSE:'+sym:'NSE:NIFTY'}
function renderTV(s){const wrap=document.getElementById('azChartWrap');if(!wrap)return;const symbol=tvSymbol(s);wrap.innerHTML='<div class="tradingview-widget-container" style="height:100%;width:100%"><div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div></div>';const box=wrap.querySelector('.tradingview-widget-container'),script=document.createElement('script');script.type='text/javascript';script.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';script.async=true;script.textContent=JSON.stringify({autosize:true,width:'100%',height:'100%',symbol,interval:'D',timezone:'exchange',theme:'dark',style:'1',locale:'en',withdateranges:true,hide_side_toolbar:false,allow_symbol_change:true,save_image:false,calendar:false,support_host:'https://www.tradingview.com',studies:['Volume@tv-basicstudies']});box.appendChild(script);const st=document.getElementById('azChartStatus');if(st)st.textContent='TradingView · '+symbol+' · Interactive chart';const hint=document.getElementById('azChartHint');if(hint)hint.textContent='TradingView chart · drawing tools, indicators, timeframes, volume, zoom and pan are available. X10 levels remain in the decision panel.'}
window.openInstrument=async function(raw){const s=raw||{};currentInstrument=s;document.getElementById('azModal').classList.add('open');document.getElementById('azModal').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.getElementById('azTitle').textContent=s.name||s.symbol||'Market Instrument';document.getElementById('azSubtitle').textContent=(s.symbol||s.name||'')+' · TradingView'+(s.isIndex?' · INDEX':' · X10');renderDNA(s);renderTrade(s);switchTab('chart');renderTV(s)};
})();
</script>'''
            p.write_text(html.replace('</body>',script+'</body>'),encoding='utf-8')
          wf=repo/'.github'/'workflows'/'apply-tradingview-chart.yml'
          if wf.exists():wf.unlink()
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/index.html .github/workflows/apply-tradingview-chart.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: replace stock and index charts with TradingView"
          git push
