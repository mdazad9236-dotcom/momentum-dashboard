name: Enable TradingView chart
on:
  push:
    branches: [main]

jobs:
  patch-chart-loader:
    if: ${{ !contains(github.event.head_commit.message, 'enable TradingView chart loader') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject TradingView loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="/static/tradingview_chart.js" defer></script>'
          if tag not in text:
              text = text.replace('</body>', tag + '</body>')
              p.write_text(text, encoding='utf-8')
          else:
              print('TradingView loader already present')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/index.html
          git commit -m 'enable TradingView chart loader'
          git push
