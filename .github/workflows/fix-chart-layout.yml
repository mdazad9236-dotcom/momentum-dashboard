name: Fix chart and analysis popup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chart API and popup layout
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          marker = '@app.after_request\ndef inject_angel_chart'
          route = '''@app.route("/api/historical/<path:symbol>")\n@login_required\ndef historical(symbol):\n    """Return Angel One historical candles for an individual stock or index."""\n    try:\n        instrument = instrument_manager.find_stock(symbol)\n        if not instrument:\n            return jsonify({"success": False, "message": f"Angel One instrument not found: {symbol}", "data": []}), 404\n        result = angel_service.get_historical_data(\n            instrument["symbol"],\n            instrument["token"],\n            days=400,\n            interval="ONE_DAY",\n            exchange=instrument.get("exchange", "NSE"),\n        )\n        return jsonify(result), (200 if result.get("success") else 502)\n    except Exception as error:\n        print("HISTORICAL API ERROR:", error)\n        return jsonify({"success": False, "message": str(error), "data": []}), 500\n\n'''
          if 'def historical(symbol)' not in text:
              if marker not in text:
                  raise SystemExit('Could not locate app.py insertion point')
              text = text.replace(marker, route + marker, 1)
              app.write_text(text, encoding='utf-8')

          html = Path('templates/index.html')
          text = html.read_text(encoding='utf-8')
          css = '''\n/* Single-page stock/index analysis: chart left, DNA + trade plan right. */\n.az-tabs{display:none!important}\n.az-content{display:grid!important;grid-template-columns:minmax(0,1.7fr) minmax(300px,.85fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:12px;overflow:hidden!important;padding:12px}\n#azPanelChart{display:block!important;grid-column:1;grid-row:1 / 3;min-width:0;min-height:0}\n#azPanelDna{display:block!important;grid-column:2;grid-row:1;min-width:0;min-height:0;overflow:auto}\n#azPanelTrade{display:block!important;grid-column:2;grid-row:2;min-width:0;min-height:0;overflow:auto}\n#azPanelChart .az-chart-wrap{height:calc(100% - 92px);min-height:360px}\n#azPanelChart .az-chart-toolbar{position:sticky;top:0;z-index:4;background:#071522;padding-bottom:7px}\n#azPanelDna .az-grid,#azPanelTrade .az-grid{grid-template-columns:1fr}\n#azPanelDna .az-info-card,#azPanelTrade .az-info-card{padding:11px}\n#azPanelDna .az-info-card h3,#azPanelTrade .az-info-card h3{margin-bottom:8px}\n@media(max-width:900px){.az-content{grid-template-columns:1fr;grid-template-rows:auto auto auto;overflow:auto!important}#azPanelChart{grid-column:1;grid-row:1}#azPanelDna{grid-column:1;grid-row:2}#azPanelTrade{grid-column:1;grid-row:3}#azPanelChart .az-chart-wrap{height:430px;min-height:0}}\n@media(max-width:600px){#azPanelChart .az-chart-wrap{height:360px}.az-content{padding:8px}}\n'''
          if 'Single-page stock/index analysis: chart left' not in text:
              text = text.replace('</style></head>', css + '</style></head>', 1)
              html.write_text(text, encoding='utf-8')
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/index.html
          git diff --cached --quiet || git commit -m "Fix Angel One stock charts and single-page analysis layout"
          git push
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/fix-chart-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-shot chart patch workflow"
          git push
