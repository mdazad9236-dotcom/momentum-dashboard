<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>X10 MarketAI — Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,Arial,sans-serif;background:#101827;color:#172033}.login-card{width:min(420px,92vw);background:#fff;border-radius:18px;padding:34px;box-shadow:0 18px 60px rgba(0,0,0,.28)}.logo{text-align:center;font-size:25px;font-weight:800;margin-bottom:8px}.logo span{color:#16a34a}.subtitle{text-align:center;color:#667085;font-size:13px;margin-bottom:28px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid #d0d5dd;border-radius:9px;font-size:15px;outline:none}.field input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}button{width:100%;border:0;border-radius:9px;padding:13px;background:#2563eb;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.error{background:#fef2f2;color:#b42318;border:1px solid #fecdca;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:16px}.private{text-align:center;color:#98a2b3;font-size:11px;margin-top:18px}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">📈 X10<span>MarketAI</span></div>
  <div class="subtitle">Private market-analysis dashboard</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST" autocomplete="off">
    <div class="field"><label for="user_id">User ID</label><input id="user_id" name="user_id" type="text" placeholder="Enter User ID" required autofocus></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Enter Password" required></div>
    <button type="submit">LOGIN</button>
  </form>
  <div class="private">Authorized access only</div>
</div>
</body>
</html>
